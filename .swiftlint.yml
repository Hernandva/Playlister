# SwiftLint configuration of Playlister.
# scripts/lint.sh runs it before every build and fails the build above 3 violations.
# New code adds zero violations (see AGENTS.md). Do not relax these rules to make a build pass.

included:
  - Playlister
  - Packages/Networking/Sources
  - Packages/Networking/Tests
  - Packages/PlaylisterUI/Sources
  - Packages/PlaylisterUI/Tests

excluded:
  - Packages/Networking/.build
  - Packages/PlaylisterUI/.build
  - DerivedData
  # Generated by scripts/codegen/design_tokens.py from tokens.json.
  - Packages/PlaylisterUI/Sources/PlaylisterUI/Tokens

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length:
    warning: 3
    error: 2
  excluded:
    - id

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 80

reporter: xcode
