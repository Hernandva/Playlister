name: Playlister
options:
  bundleIdPrefix: dev.hdvillamil
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: QBYF67CS24
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Networking:
    path: Packages/Networking
  PlaylisterUI:
    path: Packages/PlaylisterUI
targets:
  Playlister:
    type: application
    platform: iOS
    sources:
      - path: Playlister
        excludes:
          - "**/*.md"
          - "**/.gitkeep"
          - "**/.DS_Store"
          - "Info.plist"
          # Only SemiBold, Bold and ExtraBold are bundled (see Info.plist > UIAppFonts)
          - "Resources/Fonts/Unbounded-VariableFont_wght.ttf"
          - "Resources/Fonts/Unbounded-Black.ttf"
          - "Resources/Fonts/Unbounded-ExtraLight.ttf"
          - "Resources/Fonts/Unbounded-Light.ttf"
          - "Resources/Fonts/Unbounded-Medium.ttf"
          - "Resources/Fonts/Unbounded-Regular.ttf"
    dependencies:
      - package: Networking
      - package: PlaylisterUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hdvillamil.playlister
        INFOPLIST_KEY_CFBundleDisplayName: "Playlister"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Playlister/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    preBuildScripts:
      - name: SwiftLint (max 3 violations)
        script: "\"${SRCROOT}/scripts/lint.sh\""
        basedOnDependencyAnalysis: false
