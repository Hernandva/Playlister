name: Playlister
options:
  bundleIdPrefix: com.company
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Networking:
    path: Packages/Networking
  PlaylisterUI:
    path: Packages/PlaylisterUI
targets:
  Playlister:
    type: application
    platform: iOS
    sources:
      - path: Playlister
        excludes: ["**/*.md", "**/.gitkeep"]
    dependencies:
      - package: Networking
      - package: PlaylisterUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.company.playlister
        INFOPLIST_KEY_CFBundleDisplayName: "Playlister"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    preBuildScripts:
      - name: SwiftLint (max 3 violations)
        script: "\"${SRCROOT}/scripts/lint.sh\""
        basedOnDependencyAnalysis: false
